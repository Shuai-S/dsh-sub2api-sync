packages:
  - packages/*/*
allowBuilds:
  esbuild: true
# The host family this plugin is built and tested against. Exact pins in
# packages/llm/sub2api-sync/package.json are the single source of truth; this
# list only lets pnpm accept those fresh prereleases instead of holding them
# back behind the minimum-release-age gate.
minimumReleaseAgeExclude:
  - '@deepseek-ai/dsh-client-locale@0.2.2-rc.5'
  - '@deepseek-ai/dsh-client-ui-plugin-manager@0.2.2-rc.5'
  - '@deepseek-ai/dsh-client-ui-primitives@0.2.2-rc.5'
  - '@deepseek-ai/dsh-client-ui-renderer@0.2.2-rc.5'
  - '@deepseek-ai/dsh-client-ui-settings@0.2.2-rc.5'
  - '@deepseek-ai/dsh-client-ui-settings-models@0.2.2-rc.5'
  - '@deepseek-ai/dsh-client-ui-slots@0.2.2-rc.5'
  - '@deepseek-ai/dsh-host-webserver@0.2.2-rc.5'
  - '@deepseek-ai/dsh-settings@0.2.2-rc.5'
  - '@deepseek-ai/dsh-credentials@0.2.2-rc.5'
  - '@deepseek-ai/cordis@4.1.0'
